# Every push to master gets the next version tag and a release.
# Bump: major if a commit says "BREAKING CHANGE" or uses "type!:", minor for
# "feat", patch otherwise. The first release is v0.1.0.
name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          log=$(git log "$last..HEAD" --format='%s%n%b')
          if [ -z "$log" ]; then
            echo "nothing since $last"; exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          if grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\(.+\))?:' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: tag
        if: steps.version.outputs.tag != ''
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # Same job as the tag: tags pushed with GITHUB_TOKEN don't trigger workflows.
      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.tag != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
